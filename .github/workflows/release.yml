name: Release

# A tag such as v1.0.5 builds the standalone APK, signs it with the standalone
# release key and creates a DRAFT GitHub release. The owner reviews and publishes
# the draft; nothing is published automatically.
# "Run workflow" (with a tag name) builds an existing tag with this workflow,
# for example after a fix to the workflow itself.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build, for example v1.0.4"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # The signing secrets belong to this environment. Limit it to v* tags (and main,
    # for "Run workflow") in the repository settings; add required reviewers when the
    # plan allows it.
    environment: production-release
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      # Certificate SHA-256 of the standalone release key (docs/releases/signing.md).
      EXPECTED_CERT: e6302c95f0da65d8f27c80c82d4b82c979af75bbc1ea383547cd079ec178cf44
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}

      - name: Tag must match versionName
        run: |
          VERSION=$(grep -Po 'versionName = "\K[^"]+' app/build.gradle.kts)
          if [ "v$VERSION" != "$TAG" ]; then
            echo "Tag $TAG does not match versionName $VERSION"; exit 1
          fi

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      # The runner image includes the Android SDK; install only what this build pins.
      # "yes" ends with SIGPIPE when sdkmanager stops reading, so it may not fail the step.
      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          (yes || true) | "$SDKMANAGER" --licenses > /dev/null
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358" "cmake;3.22.1" > /dev/null

      - uses: gradle/actions/setup-gradle@v6

      - name: Tests and release policy
        run: ./gradlew --no-daemon testReleaseUnitTest verifyReleasePolicy

      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "Signing secrets are not configured"; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$RUNNER_TEMP/release.jks" "$STORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > "$RUNNER_TEMP/signing.properties"

      - name: Build signed APK
        run: ./gradlew --no-daemon "-PsigningProperties=$RUNNER_TEMP/signing.properties" assembleRelease

      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks" "$RUNNER_TEMP/signing.properties"

      - name: Verify signature and prepare files
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$APK" | tee certs.txt
          grep -qi "certificate SHA-256 digest: $EXPECTED_CERT" certs.txt || { echo "APK is not signed with the standalone release key"; exit 1; }
          mkdir dist
          cp "$APK" "dist/Square-Chess-$TAG.apk"
          (cd dist && sha256sum *.apk > SHA256SUMS)
          cat dist/SHA256SUMS

      - name: Create draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CODE=$(grep -Po 'versionCode = \K\d+' app/build.gradle.kts)
          NOTES=fastlane/metadata/android/en-US/changelogs/$CODE.txt
          [ -f "$NOTES" ] || { echo "Missing $NOTES"; exit 1; }
          { cat "$NOTES"; echo; echo "SHA-256:"; echo '```'; cat dist/SHA256SUMS; echo '```'; } > notes.md
          gh release create "$TAG" dist/* --draft --verify-tag \
            --title "Square Chess ${TAG#v}" --notes-file notes.md
