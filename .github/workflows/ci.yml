name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GITLEAKS_VERSION: 8.30.1

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the secret scan reads the full history

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      # The runner image includes the Android SDK; install only what this build pins.
      # "yes" ends with SIGPIPE when sdkmanager stops reading, so it may not fail the step.
      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          (yes || true) | "$SDKMANAGER" --licenses > /dev/null
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358" "cmake;3.22.1" > /dev/null

      - uses: gradle/actions/setup-gradle@v6

      - name: Unit tests, lint and release policy
        run: ./gradlew --no-daemon check

      - name: Build debug and unsigned release
        run: ./gradlew --no-daemon assembleDebug assembleRelease

      - name: Secret scan (Gitleaks, full history)
        run: |
          BASE="https://github.com/gitleaks/gitleaks/releases/download/v$GITLEAKS_VERSION"
          ARCHIVE="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLO "$BASE/$ARCHIVE"
          curl -fsSL "$BASE/gitleaks_${GITLEAKS_VERSION}_checksums.txt" | grep " $ARCHIVE\$" | sha256sum -c -
          tar -xzf "$ARCHIVE" gitleaks
          ./gitleaks git . --log-opts="--all" --redact --no-banner

      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: app/build/reports/
          if-no-files-found: ignore
          retention-days: 7
