name: Reproducibility

# Rebuilds a published release from its tag in a different folder (as F-Droid's
# build server does) and compares every file with the signed APK on GitHub
# Releases, ignoring only the signature. F-Droid publishes our signed APK only
# when this comparison matches.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Published release tag to check, for example v1.0.6"
        required: true
  push:
    branches: [main]
    paths: [".github/workflows/reproducibility.yml"]

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Choose the release
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: |
          TAG="${INPUT_TAG:-$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)}"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "Checking $TAG"

      # A folder name like F-Droid's, different from the release build's folder.
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.TAG }}
          path: build/com.dataespresso.squarechess

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          (yes || true) | "$SDKMANAGER" --licenses > /dev/null
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358" "cmake;3.22.1" > /dev/null

      - name: Build the unsigned release APK
        working-directory: build/com.dataespresso.squarechess
        run: ./gradlew --no-daemon -PsigningProperties=/nonexistent assembleRelease

      - name: Download the published APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "*.apk" --dir published

      - name: Compare every file except the signature
        run: |
          python3 - <<'EOF'
          import glob, hashlib, re, sys, zipfile
          # Only v1 (JAR) signature files are skipped; APK v2/v3 signatures are outside the entries.
          SIGNATURE = re.compile(r"^META-INF/(MANIFEST\.MF|[^/]+\.(SF|RSA|DSA|EC))$")
          def entries(path):
              with zipfile.ZipFile(path) as z:
                  return {n: hashlib.sha256(z.read(n)).hexdigest() for n in z.namelist()
                          if not SIGNATURE.match(n)}
          published = entries(glob.glob("published/*.apk")[0])
          rebuilt = entries("build/com.dataespresso.squarechess/app/build/outputs/apk/release/app-release-unsigned.apk")
          differ = sorted(n for n in published.keys() | rebuilt.keys() if published.get(n) != rebuilt.get(n))
          if differ:
              print(f"::error title=Not reproducible::{len(differ)} of {len(published)} files differ: {', '.join(differ[:10])}")
              sys.exit(1)
          print(f"::notice title=Reproducible::All {len(published)} files match the published APK (signature excluded).")
          EOF
